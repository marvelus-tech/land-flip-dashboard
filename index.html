<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Flip Builder Discovery Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;650;700;800&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════════════
           Design System — Premium Information Dashboard
           Apple HIG-inspired • Forest Green + Gold palette
           ═══════════════════════════════════════════════════════════════ */

        :root {
            /* ── Brand Colors ── */
            --green-900: #0a2e1a;
            --green-800: #0f3d23;
            --green-700: #14522e;
            --green-600: #1a6b3c;
            --green-500: #22874d;
            --green-400: #2da85f;
            --green-300: #5cc485;
            --green-200: #a3dfb5;
            --green-100: #d9f5e3;
            --green-50: #edfaf2;

            --gold-600: #b8892e;
            --gold-500: #c99a3e;
            --gold-400: #daab50;
            --gold-300: #e8c26d;
            --gold-200: #f2dc9f;
            --gold-100: #faf0d0;
            --gold-50: #fef9ec;

            /* ── Neutrals ── */
            --white: #ffffff;
            --gray-50: #f8f9fa;
            --gray-100: #f1f3f5;
            --gray-150: #e9ecef;
            --gray-200: #dee2e6;
            --gray-300: #ced4da;
            --gray-400: #adb5bd;
            --gray-500: #868e96;
            --gray-600: #495057;
            --gray-650: #343a40;
            --gray-700: #212529;
            --gray-800: #1a1d21;
            --gray-900: #0d0f12;

            /* ── Semantic ── */
            --red-500: #dc3545;
            --red-100: #ffe0e3;
            --blue-500: #1c7ed6;
            --blue-100: #dbeaff;
            --amber-500: #e67700;
            --amber-100: #fff3d6;

            /* ── Typography ── */
            --font: 'Inter', -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            --mono: 'SF Mono', 'SFMono-Regular', 'JetBrains Mono', monospace;

            /* ── Spacing Scale ── */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;
            --space-16: 64px;

            /* ── Radii ── */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 20px;
            --radius-full: 9999px;

            /* ── Shadows ── */
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.03);
            --shadow-xl: 0 20px 60px rgba(0,0,0,0.08);

            /* ── Transitions ── */
            --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
            --duration: 0.25s;
        }

        /* ── Reset ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font);
            background: var(--gray-50);
            color: var(--gray-700);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* Subtle background texture */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; height: 480px;
            background: linear-gradient(180deg, 
                rgba(26, 107, 60, 0.03) 0%, 
                rgba(201, 154, 62, 0.02) 50%, 
                transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Layout ── */
        .app-container { max-width: 1440px; margin: 0 auto; padding: 0 var(--space-8); position: relative; z-index: 1; }

        /* ── Header ── */
        .app-header {
            padding: var(--space-8) 0 var(--space-6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
            flex-wrap: wrap;
        }

        .app-title-group { display: flex; align-items: center; gap: var(--space-3); }

        .app-icon {
            width: 36px; height: 36px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--green-600), var(--green-500));
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(26, 107, 60, 0.2);
        }

        .app-title {
            font-size: 22px;
            font-weight: 650;
            letter-spacing: -0.02em;
            color: var(--gray-800);
        }

        .app-title-sub {
            font-size: 13px;
            font-weight: 400;
            color: var(--gray-500);
            letter-spacing: -0.01em;
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: var(--space-6);
        }

        .header-meta-item {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: 13px;
            color: var(--gray-500);
            font-weight: 450;
        }

        .header-meta-item .label { color: var(--gray-400); }
        .header-meta-item .value { color: var(--gray-700); font-weight: 500; }

        .header-meta-gold {
            padding: var(--space-1) var(--space-3);
            background: var(--gold-50);
            border: 1px solid var(--gold-200);
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            color: var(--gold-600);
            letter-spacing: 0.01em;
        }

        /* ── Metrics Row ── */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: var(--space-4);
            margin-bottom: var(--space-8);
        }

        .metric-tile {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: var(--space-5) var(--space-6);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.04);
            transition: box-shadow var(--duration) var(--ease);
        }

        .metric-tile:hover { box-shadow: var(--shadow-md); }

        .metric-tile .icon {
            width: 32px; height: 32px;
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            margin-bottom: var(--space-3);
        }

        .metric-tile .icon.green { background: var(--green-50); }
        .metric-tile .icon.gold { background: var(--gold-50); }
        .metric-tile .icon.blue { background: var(--blue-100); }
        .metric-tile .icon.slate { background: var(--gray-100); }

        .metric-tile .value {
            font-size: 28px;
            font-weight: 650;
            letter-spacing: -0.03em;
            color: var(--gray-800);
            line-height: 1.1;
        }

        .metric-tile .value.gold-accent { color: var(--gold-600); }
        .metric-tile .value.green-accent { color: var(--green-600); }

        .metric-tile .label {
            font-size: 12px;
            font-weight: 500;
            color: var(--gray-400);
            margin-top: var(--space-1);
            letter-spacing: 0.01em;
            text-transform: uppercase;
        }

        /* ── Controls Bar ── */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            margin-bottom: var(--space-6);
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 220px;
            max-width: 360px;
        }

        .search-wrapper svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            font-family: var(--font);
            font-size: 14px;
            font-weight: 450;
            color: var(--gray-700);
            background: var(--white);
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-md);
            transition: all var(--duration) var(--ease);
            outline: none;
        }

        .search-input::placeholder { color: var(--gray-400); }
        .search-input:focus {
            border-color: var(--green-400);
            box-shadow: 0 0 0 3px rgba(26, 107, 60, 0.08);
        }

        /* ── State Tabs (Chips) ── */
        .state-tabs {
            display: flex;
            gap: var(--space-2);
            overflow-x: auto;
            padding-bottom: var(--space-1);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .state-tabs::-webkit-scrollbar { display: none; }

        .state-tab {
            padding: 7px 16px;
            border-radius: var(--radius-full);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-500);
            background: transparent;
            border: 1.5px solid var(--gray-200);
            cursor: pointer;
            transition: all var(--duration) var(--ease);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .state-tab:hover {
            border-color: var(--gray-300);
            color: var(--gray-700);
        }

        .state-tab.active {
            background: var(--green-600);
            border-color: var(--green-600);
            color: var(--white);
            font-weight: 600;
        }

        .state-tab .count {
            display: inline-block;
            margin-left: 6px;
            padding: 0 6px;
            font-size: 11px;
            font-weight: 600;
            opacity: 0.6;
        }

        .state-tab.active .count { opacity: 0.8; }

        /* ── Builder List ── */
        .builder-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .builder-card {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: var(--space-4);
            padding: var(--space-4) var(--space-5);
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,0.04);
            transition: all var(--duration) var(--ease);
        }

        .builder-card:hover {
            box-shadow: var(--shadow-md);
            border-color: rgba(0,0,0,0.07);
        }

        .builder-main {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            min-width: 0;
        }

        .builder-avatar {
            width: 36px; height: 36px;
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 13px;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--green-600), var(--green-400));
        }

        .builder-avatar.gold { background: linear-gradient(135deg, var(--gold-600), var(--gold-400)); }

        .builder-info { min-width: 0; }

        .builder-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-800);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .builder-meta {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .builder-meta-item {
            font-size: 12px;
            color: var(--gray-500);
            font-weight: 450;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .builder-meta-item svg {
            width: 12px; height: 12px;
            flex-shrink: 0;
        }

        .county-chip {
            padding: 2px 8px;
            border-radius: var(--radius-full);
            background: var(--green-50);
            color: var(--green-700);
            font-size: 11px;
            font-weight: 500;
        }

        /* ── Status Badges ── */
        .status-badge {
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.01em;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .status-badge::before {
            content: '';
            width: 5px; height: 5px;
            border-radius: 50%;
        }

        .status-active { background: var(--green-100); color: var(--green-700); }
        .status-active::before { background: var(--green-500); }

        .status-research { background: var(--amber-100); color: #ad6200; }
        .status-research::before { background: var(--amber-500); }

        .status-contacted { background: var(--blue-100); color: #1557a0; }
        .status-contacted::before { background: var(--blue-500); }

        .status-pending { background: var(--gray-100); color: var(--gray-600); }
        .status-pending::before { background: var(--gray-400); }

        /* ── Builder Actions ── */
        .builder-actions {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            flex-shrink: 0;
        }

        .action-btn {
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 12px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all var(--duration) var(--ease);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: transparent;
            color: var(--gray-400);
        }

        .action-btn:hover { background: var(--gray-100); color: var(--gray-600); }

        .action-btn.primary {
            background: var(--green-600);
            color: var(--white);
        }

        .action-btn.primary:hover { background: var(--green-700); }

        .action-btn.gold {
            background: var(--gold-500);
            color: var(--white);
        }

        .action-btn.gold:hover { background: var(--gold-600); }

        .copy-btn {
            opacity: 0;
            transition: opacity var(--duration) var(--ease);
            padding: 4px 8px;
        }

        .builder-card:hover .copy-btn { opacity: 1; }

        /* ── Builder Details (expandable) ── */
        .builder-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: var(--space-3);
            padding: var(--space-4) var(--space-5) var(--space-5);
            background: var(--gray-50);
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            margin-top: -2px;
            border: 1px solid var(--gray-100);
            border-top: none;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .detail-item .dt-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--gray-400);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .detail-item .dt-value {
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-700);
        }

        .detail-item .dt-value a {
            color: var(--green-600);
            text-decoration: none;
        }

        .detail-item .dt-value a:hover { text-decoration: underline; }

        /* ── Empty State ── */
        .empty-state {
            text-align: center;
            padding: var(--space-16) var(--space-8);
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: var(--space-4);
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-600);
            margin-bottom: var(--space-2);
        }

        .empty-state p {
            font-size: 14px;
            color: var(--gray-400);
            max-width: 400px;
            margin: 0 auto;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--gray-800);
            color: var(--white);
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            z-index: 100;
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.35s var(--ease);
        }

        @keyframes toastIn {
            from { transform: translateY(12px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ── Utility Classes ── */
        .hidden { display: none !important; }
        .text-mono { font-family: var(--mono); }
        .text-green { color: var(--green-600); }
        .text-gold { color: var(--gold-600); }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .app-container { padding: 0 var(--space-4); }
            .app-header { flex-direction: column; align-items: flex-start; gap: var(--space-3); }
            .header-meta { flex-wrap: wrap; gap: var(--space-3); }
            .metrics-grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }
            .metric-tile { padding: var(--space-4); }
            .metric-tile .value { font-size: 22px; }
            .controls-bar { flex-direction: column; align-items: stretch; }
            .search-wrapper { max-width: none; }
            .state-tabs { padding-bottom: var(--space-2); }
            .builder-card { grid-template-columns: 1fr; gap: var(--space-3); }
            .builder-actions { justify-content: flex-end; }
            .builder-details { grid-template-columns: 1fr 1fr; }
            .copy-btn { opacity: 1; }
        }

        @media (max-width: 480px) {
            .metrics-grid { grid-template-columns: 1fr 1fr; }
            .builder-meta { flex-direction: column; align-items: flex-start; gap: 2px; }
            .builder-details { grid-template-columns: 1fr; }
        }

        /* ── SVG Icons inline ── */
        .icon-search, .icon-copy, .icon-phone, .icon-mail, .icon-globe, .icon-map-pin {
            width: 14px; height: 14px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- ════ Header ════ -->
    <header class="app-header">
        <div class="app-title-group">
            <div class="app-icon">🏡</div>
            <div>
                <div class="app-title">Builder Discovery</div>
                <div class="app-title-sub">Land Flip Pipeline</div>
            </div>
        </div>
        <div class="header-meta">
            <div class="header-meta-item">
                <span class="label">Today</span>
                <span class="value" id="current-date"></span>
            </div>
            <div class="header-meta-item">
                <span class="label">Focus</span>
                <span class="value" id="next-market"></span>
            </div>
            <span class="header-meta-gold">⏳ Research Phase</span>
        </div>
    </header>

    <!-- ════ Metrics ════ -->
    <div class="metrics-grid">
        <div class="metric-tile">
            <div class="icon green">📋</div>
            <div class="value" id="total-builders">0</div>
            <div class="label">Total Builders</div>
        </div>
        <div class="metric-tile">
            <div class="icon gold">⚡</div>
            <div class="value gold-accent" id="active-builders">0</div>
            <div class="label">Active</div>
        </div>
        <div class="metric-tile">
            <div class="icon blue">🔍</div>
            <div class="value" id="research-builders">0</div>
            <div class="label">In Research</div>
        </div>
        <div class="metric-tile">
            <div class="icon slate">📍</div>
            <div class="value green-accent" id="state-count">0</div>
            <div class="label">States Covered</div>
        </div>
    </div>

    <!-- ════ Controls ════ -->
    <div class="controls-bar">
        <div class="search-wrapper">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" class="search-input" id="search-input" placeholder="Search builders, counties, or states..." oninput="filterBuilders()" autocomplete="off">
        </div>
        <div class="state-tabs" id="state-tabs"></div>
        <button class="action-btn primary" onclick="exportCSV()" title="Export all data as CSV">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export CSV
        </button>
    </div>

    <!-- ════ Builder List ════ -->
    <div class="builder-list" id="builder-list">
        <!-- Rendered by JS -->
    </div>

    <!-- ════ Empty State ════ -->
    <div class="empty-state hidden" id="empty-state">
        <div class="icon">🔎</div>
        <h3>No builders found</h3>
        <p>Try adjusting your search or filter to discover local builder contacts for your land flip pipeline.</p>
    </div>
</div>

<script>
    // ═══════════════════════════════════════════════════════════════════
    // State
    // ═══════════════════════════════════════════════════════════════════

    const states = {
        texas: { name: 'Texas', color: 'bg-red-100 text-red-800', metro: 'Houston', counties: ['Montgomery', 'Fort Bend', 'Harris', 'Waller', 'Brazoria', 'Galveston'] },
        florida: { name: 'Florida', color: 'bg-orange-100 text-orange-800', metro: 'Orlando', counties: ['Polk', 'Lake', 'Osceola', 'Orange', 'Seminole'] },
        'north-carolina': { name: 'North Carolina', color: 'bg-blue-100 text-blue-800', metro: 'Charlotte', counties: ['Rowan', 'Cabarrus', 'Iredell', 'Union', 'Mecklenburg'] },
        arizona: { name: 'Arizona', color: 'bg-yellow-100 text-yellow-800', metro: 'Phoenix', counties: ['Maricopa', 'Pinal', 'Yavapai'] },
        tennessee: { name: 'Tennessee', color: 'bg-purple-100 text-purple-800', metro: 'Nashville', counties: ['Rutherford', 'Wilson', 'Sumner', 'Williamson'] },
        georgia: { name: 'Georgia', color: 'bg-green-100 text-green-800', metro: 'Atlanta', counties: ['Forsyth', 'Hall', 'Jackson', 'Douglas', 'Gwinnett'] },
        'south-carolina': { name: 'South Carolina', color: 'bg-indigo-100 text-indigo-800', metro: 'Charleston', counties: ['Berkeley', 'Dorchester', 'Charleston'] },
        indiana: { name: 'Indiana', color: 'bg-pink-100 text-pink-800', metro: 'Indianapolis', counties: ['Boone', 'Hamilton', 'Hendricks'] }
    };

    let builderData = [];
    let currentState = localStorage.getItem('landflip_currentState') || 'all';

    // ═══════════════════════════════════════════════════════════════════

    function init() {
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        const dayMod = new Date().getDate() % 8;
        const marketNames = ['Indiana', 'Texas', 'Florida', 'North Carolina', 'Arizona', 'Tennessee', 'Georgia', 'South Carolina'];
        document.getElementById('next-market').textContent = `Next: ${marketNames[dayMod]}`;

        renderTabs();
        loadData();
    }

    function loadData() {
        const stored = localStorage.getItem('builderData');
        if (stored) {
            const parsed = JSON.parse(stored);
            builderData = parsed.filter(b => !b.phone.includes('555'));
            if (builderData.length === 0) {
                builderData = JSON.parse(JSON.stringify(DEFAULT_BUILDERS));
                localStorage.setItem('builderData', JSON.stringify(builderData));
            }
        } else {
            builderData = JSON.parse(JSON.stringify(DEFAULT_BUILDERS));
            localStorage.setItem('builderData', JSON.stringify(builderData));
        }
        renderBuilders();
        updateStats();
    }

    function saveData() {
        localStorage.setItem('builderData', JSON.stringify(builderData));
    }

    function renderTabs() {
        const tabsContainer = document.getElementById('state-tabs');
        let html = `
            <button onclick="setState('all')" class="state-tab ${currentState === 'all' ? 'active' : ''}" data-state="all">
                All
                <span class="count">${builderData.length}</span>
            </button>
        `;

        Object.entries(states).forEach(([key, state]) => {
            const count = builderData.filter(b => b.state === key).length;
            html += `
                <button onclick="setState('${key}')" class="state-tab ${currentState === key ? 'active' : ''}" data-state="${key}">
                    ${state.name}
                    <span class="count">${count}</span>
                </button>
            `;
        });

        tabsContainer.innerHTML = html;
    }

    function setState(state) {
        currentState = state;
        localStorage.setItem('landflip_currentState', state);
        renderTabs();
        filterBuilders();
    }

    function filterBuilders() {
        const searchTerm = document.getElementById('search-input').value.toLowerCase();
        let filtered = builderData;

        if (currentState !== 'all') {
            filtered = filtered.filter(b => b.state === currentState);
        }

        if (searchTerm) {
            filtered = filtered.filter(b =>
                b.name.toLowerCase().includes(searchTerm) ||
                b.county.toLowerCase().includes(searchTerm) ||
                b.state.toLowerCase().includes(searchTerm) ||
                b.email.toLowerCase().includes(searchTerm)
            );
        }

        renderBuilders(filtered);
        updateStats(filtered);
    }

    function renderBuilders(filteredData) {
        const data = filteredData || builderData;
        const container = document.getElementById('builder-list');
        const emptyState = document.getElementById('empty-state');
        const searchTerm = document.getElementById('search-input').value.toLowerCase();

        let displayData = data;
        if (currentState !== 'all') {
            displayData = displayData.filter(b => b.state === currentState);
        }
        if (searchTerm) {
            displayData = displayData.filter(b =>
                b.name.toLowerCase().includes(searchTerm) ||
                b.county.toLowerCase().includes(searchTerm) ||
                b.state.toLowerCase().includes(searchTerm) ||
                b.email.toLowerCase().includes(searchTerm)
            );
        }

        if (displayData.length === 0) {
            container.innerHTML = '';
            emptyState.classList.remove('hidden');
            return;
        }

        emptyState.classList.add('hidden');

        let html = '';
        displayData.forEach(builder => {
            const stateKey = builder.state || 'unknown';
            const stateInfo = states[stateKey] || { name: builder.state, counties: [] };
            const isActive = builder.status === 'active';
            const statusClass = builder.status === 'active' ? 'active' : builder.status === 'contacted' ? 'contacted' : builder.status === 'research' ? 'research' : 'pending';

            html += `
                <div class="builder-card">
                    <div class="builder-main">
                        <div class="builder-avatar ${isActive ? '' : 'gold'}">${builder.initials || builder.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase()}</div>
                        <div class="builder-info">
                            <div class="builder-name">${builder.name}</div>
                            <div class="builder-meta">
                                <span class="builder-meta-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                                    ${builder.county}
                                </span>
                                <span class="builder-meta-item">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                                    ${stateInfo.name}
                                </span>
                                <span class="status-badge ${statusClass}">${builder.status}</span>
                            </div>
                        </div>
                    </div>
                    <div class="builder-actions">
                        <button class="action-btn copy-btn" onclick="copyBuilder(${builder.id})" title="Copy details">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        </button>
                        <button class="action-btn primary" onclick="toggleDetails(${builder.id})" title="View details">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                    </div>
                </div>
                <div class="builder-details hidden" id="details-${builder.id}">
                    ${builder.phone ? `<div class="detail-item"><span class="dt-label">Phone</span><span class="dt-value">${builder.phone}</span></div>` : ''}
                    ${builder.email ? `<div class="detail-item"><span class="dt-label">Email</span><span class="dt-value"><a href="mailto:${builder.email}">${builder.email}</a></span></div>` : ''}
                    ${builder.website ? `<div class="detail-item"><span class="dt-label">Website</span><span class="dt-value"><a href="${builder.website}" target="_blank">${builder.website.replace('https://','').replace('http://','').replace('www.','')}</a></span></div>` : ''}
                    ${builder.buyBox ? `<div class="detail-item"><span class="dt-label">Buy Box</span><span class="dt-value">${builder.buyBox}</span></div>` : ''}
                    ${builder.volume ? `<div class="detail-item"><span class="dt-label">Volume</span><span class="dt-value">${builder.volume}</span></div>` : ''}
                    ${builder.metro ? `<div class="detail-item"><span class="dt-label">Metro</span><span class="dt-value">${builder.metro}</span></div>` : ''}
                </div>
            `;
        });

        container.innerHTML = html;
        updateStats(displayData);
    }

    function updateStats(filteredData) {
        const data = filteredData || builderData;
        document.getElementById('total-builders').textContent = data.length;
        document.getElementById('active-builders').textContent = data.filter(b => b.status === 'active').length;
        document.getElementById('research-builders').textContent = data.filter(b => b.status === 'research').length;

        const uniqueStates = new Set(data.map(b => b.state));
        document.getElementById('state-count').textContent = uniqueStates.size;
    }

    function toggleDetails(id) {
        const el = document.getElementById('details-' + id);
        if (el) {
            el.classList.toggle('hidden');
        }
    }

    function copyBuilder(id) {
        const builder = builderData.find(b => b.id === id);
        if (!builder) return;

        let text = `${builder.name}\n`;
        if (builder.phone) text += `📞 ${builder.phone}\n`;
        if (builder.email) text += `✉️ ${builder.email}\n`;
        if (builder.website) text += `🌐 ${builder.website}\n`;
        text += `📍 ${builder.county}, ${states[builder.state]?.name || builder.state}\n`;
        if (builder.buyBox) text += `📦 ${builder.buyBox}`;

        navigator.clipboard.writeText(text).then(() => {
            showToast(`Copied ${builder.name}`);
        }).catch(() => {
            // Fallback
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast(`Copied ${builder.name}`);
        });
    }

    function exportCSV() {
        if (builderData.length === 0) {
            showToast('No data to export');
            return;
        }

        const headers = ['Name','Phone','Email','Website','County','State','Metro','Buy Box','Volume','Status','Date Added'];
        const rows = builderData.map(b => [
            `"${(b.name||'').replace(/"/g,'""')}"`,
            `"${b.phone||''}"`,
            `"${b.email||''}"`,
            `"${b.website||''}"`,
            `"${b.county||''}"`,
            `"${states[b.state]?.name||b.state||''}"`,
            `"${b.metro||''}"`,
            `"${(b.buyBox||'').replace(/"/g,'""')}"`,
            `"${b.volume||''}"`,
            b.status||'',
            b.dateAdded||''
        ]);

        const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'land-flip-builders.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('CSV exported');
    }

    function showToast(msg) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    // ════ Init ════
    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
