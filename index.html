<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Flip — Builder Discovery & Land Recon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ═══════════════════════════════════════════════════════════════
           Design System — Dark Premium Dashboard
           Linear-inspired • Near-black canvas • Warm copper accent
           ═══════════════════════════════════════════════════════════════ */

        :root {
            /* ── Canvas & Surfaces ── */
            --canvas: #09090b;
            --canvas-soft: #0c0c0f;
            --surface: #111114;
            --surface-elevated: #18181c;
            --surface-card: #1c1c22;
            --surface-hover: #22222a;

            /* ── Text ── */
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --text-tertiary: #52525b;

            /* ── Accents ── */
            --accent: #d4a574;
            --accent-hover: #e0b88a;
            --accent-muted: rgba(212, 165, 116, 0.15);
            --accent-subtle: rgba(212, 165, 116, 0.08);

            /* ── Semantic ── */
            --success: #5bbaa9;
            --success-bg: rgba(91, 186, 169, 0.12);
            --danger: #c75d5d;
            --danger-bg: rgba(199, 93, 93, 0.12);
            --warning: #c9a96e;
            --warning-bg: rgba(201, 169, 110, 0.12);
            --info: #6b8fc9;
            --info-bg: rgba(107, 143, 201, 0.12);

            /* ── Borders ── */
            --hairline: rgba(255, 255, 255, 0.06);
            --hairline-strong: rgba(255, 255, 255, 0.10);
            --hairline-focus: rgba(212, 165, 116, 0.4);

            /* ── Typography ── */
            --font-display: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', monospace;

            /* ── Spacing ── */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;
            --space-16: 64px;

            /* ── Radii ── */
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-full: 9999px;

            /* ── Shadows ── */
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.2);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.25);
            --shadow-xl: 0 20px 60px rgba(0,0,0,0.5);

            /* ── Transitions ── */
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --duration: 0.2s;
        }

        /* ── Reset ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background: var(--canvas);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ── Subtle background texture ── */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(212, 165, 116, 0.03), transparent),
                radial-gradient(ellipse 50% 40% at 80% 80%, rgba(212, 165, 116, 0.02), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Layout ── */
        .app-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 var(--space-8);
            position: relative;
            z-index: 1;
        }

        /* ── Header ── */
        .app-header {
            padding: var(--space-10) 0 var(--space-6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-4);
            flex-wrap: wrap;
            border-bottom: 1px solid var(--hairline);
            margin-bottom: var(--space-6);
        }

        .app-title-group { display: flex; align-items: center; gap: var(--space-3); }

        .app-icon {
            width: 36px; height: 36px;
            border-radius: var(--radius-md);
            background: var(--accent-muted);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent);
            font-size: 18px;
        }

        .app-title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-primary);
        }

        .app-title-sub {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: -0.01em;
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: var(--space-5);
        }

        .header-meta-item { display: flex; align-items: center; gap: var(--space-2); }

        .header-meta-item .label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .header-meta-item .value {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-meta-gold {
            padding: 3px 12px;
            background: var(--accent-subtle);
            border: 1px solid var(--accent-muted);
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.01em;
        }

        /* ── Content Section ── */
        .content-section {}

        /* ── Metrics Grid ── */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: var(--space-3);
            margin-bottom: var(--space-6);
        }

        .metric-tile {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: var(--space-5) var(--space-6);
            border: 1px solid var(--hairline);
            transition: all var(--duration) var(--ease);
            position: relative;
            overflow: hidden;
        }

        .metric-tile::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity var(--duration) var(--ease);
        }

        .metric-tile:hover {
            border-color: var(--hairline-strong);
            background: var(--surface-elevated);
        }

        .metric-tile:hover::before { opacity: 0.5; }

        .metric-tile .icon {
            width: 32px; height: 32px;
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            margin-bottom: var(--space-3);
            color: var(--text-primary);
        }

        .metric-tile .icon.green { background: var(--success-bg); color: var(--success); }
        .metric-tile .icon.gold { background: var(--accent-muted); color: var(--accent); }
        .metric-tile .icon.blue { background: var(--info-bg); color: var(--info); }
        .metric-tile .icon.slate { background: rgba(255,255,255,0.06); color: var(--text-secondary); }

        .metric-tile .value {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .metric-tile .value.gold-accent { color: var(--accent); }
        .metric-tile .value.green-accent { color: var(--success); }

        .metric-tile .label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: var(--space-1);
            letter-spacing: 0.01em;
            text-transform: uppercase;
        }

        /* ── Controls Bar ── */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-5);
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            min-width: 200px;
            max-width: 320px;
        }

        .search-wrapper svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            width: 14px; height: 14px;
        }

        .search-input {
            width: 100%;
            padding: 8px 14px 8px 36px;
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            background: var(--surface);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-md);
            transition: all var(--duration) var(--ease);
            outline: none;
        }

        .search-input::placeholder { color: var(--text-tertiary); }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-subtle);
            background: var(--surface-elevated);
        }

        /* ── State Tabs ── */
        .state-tabs {
            display: flex;
            gap: var(--space-1);
            overflow-x: auto;
            padding: 2px;
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px solid var(--hairline);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .state-tabs::-webkit-scrollbar { display: none; }

        .state-tab {
            padding: 5px 12px;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all var(--duration) var(--ease);
            white-space: nowrap;
            flex-shrink: 0;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .state-tab:hover { color: var(--text-secondary); }

        .state-tab.active {
            background: var(--accent-muted);
            color: var(--accent);
        }

        .state-tab .count {
            display: inline-block;
            margin-left: 4px;
            padding: 0 4px;
            font-size: 10px;
            font-weight: 600;
            opacity: 0.5;
        }

        .state-tab.active .count { opacity: 0.8; }

        /* ── County Guide Panel ── */
        .county-guide {
            background: var(--surface);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-lg);
            padding: 0;
            margin: var(--space-3) 0;
            width: 100%;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s var(--ease), padding 0.3s var(--ease), margin 0.3s var(--ease);
        }

        .county-guide.open {
            max-height: 2000px;
            padding: var(--space-5) var(--space-6);
            margin: var(--space-3) 0 var(--space-5);
        }

        .county-guide-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-4);
        }

        .county-guide-header h3 {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .county-guide-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
            border-radius: var(--radius-sm);
            line-height: 1;
        }

        .county-guide-close:hover { background: rgba(255,255,255,0.06); color: var(--text-secondary); }

        .county-guide-card {
            background: var(--surface-elevated);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-md);
            padding: var(--space-4);
            margin-bottom: var(--space-3);
        }

        .county-guide-card h4 {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin: 0 0 6px;
        }

        .county-guide-card p {
            font-size: 12px;
            line-height: 1.5;
            color: var(--text-secondary);
            margin: 0;
        }

        .county-guide-card a {
            color: var(--accent);
            text-decoration: none;
        }
        .county-guide-card a:hover { text-decoration: underline; }

        /* ── Data Type Tabs ── */
        .data-tabs {
            display: flex;
            gap: 0;
            margin-bottom: var(--space-4);
            background: var(--surface);
            padding: 2px;
            border-radius: var(--radius-md);
            border: 1px solid var(--hairline);
            width: -moz-fit-content;
            width: fit-content;
        }

        .data-tab {
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all var(--duration) var(--ease);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .data-tab:hover { color: var(--text-secondary); }

        .data-tab.active {
            background: var(--accent-muted);
            color: var(--accent);
        }

        .data-tab .tab-icon { display: inline-flex; align-items: center; }

        /* ── Builder List ── */
        .builder-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .builder-card {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-4) var(--space-5);
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--hairline);
            transition: all var(--duration) var(--ease);
            position: relative;
        }

        .builder-card:hover {
            border-color: var(--hairline-strong);
            background: var(--surface-elevated);
        }

        .builder-main {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            min-width: 0;
        }

        .builder-avatar {
            width: 34px; height: 34px;
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-primary);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 12px;
            flex-shrink: 0;
            background: var(--accent-muted);
            color: var(--accent);
        }

        .builder-avatar.gold { background: var(--success-bg); color: var(--success); }

        .builder-info { min-width: 0; }

        .builder-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .builder-meta {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            flex-wrap: wrap;
            margin-top: 1px;
        }

        .builder-meta-item {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .builder-meta-item svg {
            width: 11px; height: 11px;
            flex-shrink: 0;
        }

        .county-chip {
            padding: 1px 7px;
            border-radius: var(--radius-full);
            background: var(--accent-subtle);
            color: var(--accent);
            font-size: 10px;
            font-weight: 600;
        }

        /* ── Status Badges ── */
        .status-badge {
            padding: 2px 10px;
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .status-badge::before {
            content: '';
            width: 4px; height: 4px;
            border-radius: 50%;
        }

        .status-active { background: var(--success-bg); color: var(--success); }
        .status-active::before { background: var(--success); }

        .status-research { background: var(--accent-muted); color: var(--accent); }
        .status-research::before { background: var(--accent); }

        .status-contacted { background: var(--info-bg); color: var(--info); }
        .status-contacted::before { background: var(--info); }

        .status-pending { background: rgba(255,255,255,0.06); color: var(--text-muted); }
        .status-pending::before { background: var(--text-muted); }

        /* ── Builder Actions ── */
        .builder-actions {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            flex-shrink: 0;
        }

        .action-btn {
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all var(--duration) var(--ease);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: transparent;
            color: var(--text-muted);
        }

        .action-btn:hover { background: rgba(255,255,255,0.06); color: var(--text-secondary); }

        .action-btn.primary {
            background: var(--accent-muted);
            color: var(--accent);
        }

        .action-btn.primary:hover {
            background: var(--accent-hover);
            color: var(--canvas);
        }

        .action-btn.gold {
            background: var(--accent-muted);
            color: var(--accent);
        }

        .action-btn.gold:hover {
            background: var(--accent-hover);
            color: var(--canvas);
        }

        .copy-btn {
            opacity: 0;
            transition: opacity var(--duration) var(--ease);
            padding: 4px 7px;
        }

        .builder-card:hover .copy-btn { opacity: 1; }

        /* ── Builder Details (expandable) ── */
        .builder-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: var(--space-3);
            padding: var(--space-4) var(--space-5) var(--space-5);
            background: var(--surface-elevated);
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            margin-top: -1px;
            border: 1px solid var(--hairline);
            border-top: none;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .detail-item .dt-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .detail-item .dt-value {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .detail-item .dt-value a {
            color: var(--accent);
            text-decoration: none;
        }
        .detail-item .dt-value a:hover { text-decoration: underline; }

        /* ── Empty State ── */
        .empty-state {
            text-align: center;
            padding: var(--space-12) var(--space-6);
        }

        .empty-state .empty-illustration {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--space-5);
            border-radius: var(--radius-xl);
            background: var(--accent-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state .empty-illustration svg {
            color: var(--accent);
            opacity: 0.5;
            width: 28px; height: 28px;
        }

        .empty-state h3 {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .empty-state p {
            font-size: 13px;
            color: var(--text-muted);
            max-width: 380px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--surface-elevated);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 600;
            z-index: 100;
            border: 1px solid var(--hairline-strong);
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.35s var(--ease);
        }

        @keyframes toastIn {
            from { transform: translateY(12px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ── Lot Cards ── */
        .lot-section {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .lot-card {
            padding: var(--space-4) var(--space-5);
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--hairline);
            transition: all var(--duration) var(--ease);
        }

        .lot-card:hover {
            border-color: var(--hairline-strong);
            background: var(--surface-elevated);
        }

        .lot-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--space-3);
            margin-bottom: var(--space-2);
        }

        .lot-address {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .lot-owner {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .lot-fee {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.02em;
        }

        .lot-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
            margin-top: var(--space-2);
        }

        .lot-meta-item {
            font-size: 10px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .lot-badge {
            padding: 1px 7px;
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 600;
        }

        .lot-uw-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: var(--space-1);
            margin-top: var(--space-2);
        }

        .uw-pill {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .uw-pass { background: var(--success-bg); color: var(--success); }
        .uw-fail { background: var(--danger-bg); color: var(--danger); }
        .uw-warn { background: var(--warning-bg); color: var(--warning); }
        .uw-unknown { background: rgba(255,255,255,0.05); color: var(--text-muted); }

        .lot-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: var(--space-3);
            padding: var(--space-3) var(--space-4);
            background: var(--surface-elevated);
            border-radius: var(--radius-md);
            margin-top: var(--space-3);
            border: 1px solid var(--hairline);
        }

        .lot-detail-item {}
        .lot-detail-item .dt-label {
            font-size: 9px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .lot-detail-item .dt-value {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* ── Utility ── */
        .hidden { display: none !important; }
        .text-mono { font-family: var(--font-mono); }
        .text-green { color: var(--success); }
        .text-gold { color: var(--accent); }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

        /* ── SVG Icon sizing ── */
        .icon-svg { width: 16px; height: 16px; flex-shrink: 0; }
        .icon-svg-sm { width: 12px; height: 12px; flex-shrink: 0; }
        .icon-search, .icon-copy, .icon-phone, .icon-mail, .icon-globe, .icon-map-pin {
            width: 12px; height: 12px; flex-shrink: 0;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .app-container { padding: 0 var(--space-4); }
            .app-header { flex-direction: column; align-items: flex-start; gap: var(--space-3); }
            .header-meta { flex-wrap: wrap; gap: var(--space-3); }
            .metrics-grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-2); }
            .metric-tile { padding: var(--space-4); }
            .metric-tile .value { font-size: 22px; }
            .controls-bar { flex-direction: column; align-items: stretch; }
            .search-wrapper { max-width: none; }
            .state-tabs { padding-bottom: var(--space-1); }

            .builder-actions { justify-content: flex-end; }

        }

            .builder-meta { flex-direction: column; align-items: flex-start; gap: 2px; }

    // ═══════════════════════════════════════════════════════════════════
    // Lot Data Model & Functions
    // ═══════════════════════════════════════════════════════════════════

    const DEFAULT_LOTS = [];

    function loadLotData() {
        const stored = localStorage.getItem('lotData');
        if (stored) {
            lotData = JSON.parse(stored);
        } else {
            lotData = JSON.parse(JSON.stringify(DEFAULT_LOTS));
            localStorage.setItem('lotData', JSON.stringify(lotData));
        }
        updateLotBadge();
    }

    function saveLotData() {
        localStorage.setItem('lotData', JSON.stringify(lotData));
        updateLotBadge();
    }

    function updateLotBadge() {
        const badge = document.getElementById('lot-count-badge');
        if (badge) badge.textContent = `(${lotData.length})`;
    }

    /** Add a lot from LandLot-recon output */
    function addLotFromRecon(lot) {
        lot.id = Date.now() + Math.floor(Math.random() * 1000);
        lot.dateAdded = new Date().toISOString().split('T')[0];
        lot.status = lot.status || 'new';
        lotData.push(lot);
        saveLotData();
        renderLots();
        showToast('Lot added: ' + (lot.propertyAddress || 'Unknown'));
    }

    /** Add multiple lots at once from a recon batch */
    function addLotsBatch(lots) {
        lots.forEach(lot => {
            lot.id = Date.now() + Math.floor(Math.random() * 10000);
            lot.dateAdded = new Date().toISOString().split('T')[0];
            lot.status = lot.status || 'new';
        });
        lotData = lotData.concat(lots);
        saveLotData();
        renderLots();
        showToast('Added ' + lots.length + ' lots from recon');
    }

    function renderLots() {
        const container = document.getElementById('lot-section');
        const emptyState = document.getElementById('empty-state');

        if (lotData.length === 0) {
            container.innerHTML = '';
            return;
        }

        emptyState.classList.add('hidden');

        let html = '';
        lotData.forEach(lot => {
            const fee = lot.estimatedFee ? '$' + Number(lot.estimatedFee).toLocaleString() : '—';
            const infillClass = lot.infillStatus ? 'infill' : 'raw';
            const infillLabel = lot.infillStatus ? 'Infill' : 'Raw Land';

            html += `<div class="lot-card">
                <div class="lot-header">
                    <div>
                        <div class="lot-address">${lot.propertyAddress || 'Address TBD'}</div>
                        <div class="lot-owner">${lot.ownerName || 'Owner TBD'}</div>
                    </div>
                    <div style="text-align:right">
                        <div class="lot-fee">${fee}</div>
                        <span class="status-badge status-${lot.status === 'new' ? 'research' : lot.status === 'contacted' ? 'active' : lot.status}">${lot.status}</span>
                    </div>
                </div>
                <div class="lot-meta-row">
                    ${lot.county ? `<span class="lot-meta-item"><svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 0 1 -2.827 0l-4.244-4.243a8 8 0 1 1 11.314 0z"/></svg> ${lot.county}${lot.state ? ', ' + (states[lot.state]?.name||lot.state) : ''}</span>` : ''}
                    ${lot.lotSize ? `<span class="lot-meta-item"><svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z"/><path d="M7 3v4a1 1 0 0 0 1 1h8a1 1 0 0 0 1 -1v-4"/><path d="M7 8v4"/><path d="M7 13v3"/><path d="M11 8v3"/><path d="M11 14v.5"/></svg> ${lot.lotSize}</span>` : ''}
                    ${lot.taxDelinquentAmount ? `<span class="lot-meta-item"><svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.7 8A3 3 0 0 0 14 6h-4a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6h-4a3 3 0 0 1 -2.7 -2"/><path d="M12 3v3m0 12v3"/></svg> ${lot.taxDelinquentAmount} delinquent</span>` : ''}
                    <span class="lot-badge ${infillClass}">${infillLabel}</span>
                    ${lot.floodZone ? `<span class="lot-badge ${lot.floodZone === '100yr' ? 'raw' : 'infill'}">${lot.floodZone === '100yr' ? 'Flood 100yr' : lot.floodZone === '500yr' ? 'Flood 500yr' : lot.floodZone}</span>` : ''}
                </div>
                <div class="lot-uw-grid">
                    <div><span class="uw-pill ${lot.infillStatus ? 'uw-pass' : 'uw-warn'}"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12H3l9-9 9 9h-2"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> ${lot.infillStatus ? 'Infill' : 'Raw'}</span></div>
                    <div><span class="uw-pill ${lot.utilities ? 'uw-pass' : lot.utilities === false ? 'uw-fail' : 'uw-unknown'}"><svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3l-7 11h6l-1 7 7-11h-6z"/></svg> ${lot.utilities === true ? 'Utils Yes' : lot.utilities === false ? 'No Util' : 'Util ?'}</span></div>

    /** Switch between Builders and Lots tabs */
    function switchDataTab(tab) {
        currentTab = tab;
        // Update tab buttons
        document.querySelectorAll('.data-tab').forEach(el => el.classList.remove('active'));
        document.getElementById('data-tab-' + tab).classList.add('active');
        // Show/hide sections
        const builderList = document.getElementById('builder-list');
        const lotSection = document.getElementById('lot-section');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const stateTabs = document.getElementById('state-tabs');

        if (tab === 'builders') {
            builderList.classList.remove('hidden');
            lotSection.classList.add('hidden');
            searchInput.placeholder = 'Search builders, counties, or states...';
            stateTabs.style.display = 'flex';
            document.getElementById('metric-label-total').textContent = 'Total';
            document.getElementById('metric-label-active').textContent = 'Active';
            document.getElementById('metric-label-research').textContent = 'In Research';
            document.getElementById('metric-label-markets').textContent = 'States';
            if (builderData.length === 0) emptyState.classList.remove('hidden');
            else emptyState.classList.add('hidden');
        } else {
            builderList.classList.add('hidden');
            lotSection.classList.remove('hidden');
            searchInput.placeholder = 'Search lots by address, county, or owner...';
            stateTabs.style.display = 'flex';
            document.getElementById('empty-title').textContent = 'No lots found';
            document.getElementById('empty-desc').textContent = 'Run LandLot-recon to discover tax-delinquent land owners in your target markets.';
            document.getElementById('metric-label-total').textContent = 'Total Lots';
            document.getElementById('metric-label-active').textContent = 'In Play';
            document.getElementById('metric-label-research').textContent = 'New Leads';
            document.getElementById('metric-label-markets').textContent = 'Counties';
            if (lotData.length === 0) emptyState.classList.remove('hidden');
            else emptyState.classList.add('hidden');
            renderLots();
        }
        updateStats();
    }

    function init() {
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        const dayMod = new Date().getDate() % 8;
        const marketNames = ['Indiana', 'Texas', 'Florida', 'North Carolina', 'Arizona', 'Tennessee', 'Georgia', 'South Carolina'];
        document.getElementById('next-market').textContent = `Next: ${marketNames[dayMod]}`;

        loadLotData();
        renderTabs();
        loadData();
        switchDataTab('builders');
    }

    function loadData() {
        const stored = localStorage.getItem('builderData');
        if (stored) {
            const parsed = JSON.parse(stored);
            builderData = parsed.filter(b => !b.phone.includes('555'));
            if (builderData.length === 0) {
                builderData = JSON.parse(JSON.stringify(DEFAULT_BUILDERS));
                localStorage.setItem('builderData', JSON.stringify(builderData));
            }
        } else {
            builderData = JSON.parse(JSON.stringify(DEFAULT_BUILDERS));
            localStorage.setItem('builderData', JSON.stringify(builderData));
        }
        renderBuilders();
        updateStats();
    }

    function saveData() {
        localStorage.setItem('builderData', JSON.stringify(builderData));
    }

    function renderTabs() {
        const tabsContainer = document.getElementById('state-tabs');
        let html = `
            <button onclick="setState('all')" class="state-tab ${currentState === 'all' ? 'active' : ''}" data-state="all">
                All
                <span class="count">${builderData.length}</span>
            </button>
        `;

        Object.entries(states).forEach(([key, state]) => {
            const count = builderData.filter(b => b.state === key).length;
            html += `
                <button onclick="setState('${key}')" class="state-tab ${currentState === key ? 'active' : ''}" data-state="${key}">
                    ${state.name}
                    <span class="count">${count}</span>
                </button>
            `;
        });

        tabsContainer.innerHTML = html;
    }

    function setState(state) {
        currentState = state;
        localStorage.setItem('landflip_currentState', state);
        renderTabs();
        filterBuilders();
    }

    function filterBuilders() {
        const searchTerm = document.getElementById('search-input').value.toLowerCase();
        let filtered = builderData;

        if (currentState !== 'all') {
            filtered = filtered.filter(b => b.state === currentState);
        }

        if (searchTerm) {
            filtered = filtered.filter(b =>
                b.name.toLowerCase().includes(searchTerm) ||
                b.county.toLowerCase().includes(searchTerm) ||
                b.state.toLowerCase().includes(searchTerm) ||
                b.email.toLowerCase().includes(searchTerm)
            );
        }

        renderBuilders(filtered);
        updateStats(filtered);
    }

    function renderBuilders(filteredData) {
        const data = filteredData || builderData;
        const container = document.getElementById('builder-list');
        const emptyState = document.getElementById('empty-state');
        const searchTerm = document.getElementById('search-input').value.toLowerCase();

        let displayData = data;
        if (currentState !== 'all') {
            displayData = displayData.filter(b => b.state === currentState);
        }
        if (searchTerm) {
            displayData = displayData.filter(b =>
                b.name.toLowerCase().includes(searchTerm) ||
                b.county.toLowerCase().includes(searchTerm) ||
                b.state.toLowerCase().includes(searchTerm) ||
                b.email.toLowerCase().includes(searchTerm)
            );
        }

        if (displayData.length === 0) {
            container.innerHTML = '';
            emptyState.classList.remove('hidden');
            return;
        }

        emptyState.classList.add('hidden');

        let html = '';
        displayData.forEach(builder => {
            const stateKey = builder.state || 'unknown';
            const stateInfo = states[stateKey] || { name: builder.state, counties: [] };
            const isActive = builder.status === 'active';
            const statusClass = builder.status === 'active' ? 'active' : builder.status === 'contacted' ? 'contacted' : builder.status === 'research' ? 'research' : 'pending';

            html += `
                <div class="builder-card">
                    <div class="builder-main">
                        <div class="builder-avatar ${isActive ? '' : 'gold'}">${builder.initials || builder.name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase()}</div>
                        <div class="builder-info">
                            <div class="builder-name">${builder.name}</div>
                            <div class="builder-meta">
                                <span class="builder-meta-item">
                                    <svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 0 1 -2.827 0l-4.244-4.243a8 8 0 1 1 11.314 0z"/></svg>
                                    ${builder.county}
                                </span>
                                <span class="builder-meta-item">
                                    <svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12H3l9-9 9 9h-2"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
                                    ${stateInfo.name}
                                </span>
                                <span class="status-badge ${statusClass}">${builder.status}</span>
                            </div>
                        </div>
                    </div>
                    <div class="builder-actions">
                        <button class="action-btn copy-btn" onclick="copyBuilder(${builder.id})" title="Copy details">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        </button>
                        <button class="action-btn primary" onclick="toggleDetails(${builder.id})" title="View details">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                    </div>
                </div>
                <div class="builder-details hidden" id="details-${builder.id}">
                    ${builder.phone ? `<div class="detail-item"><span class="dt-label">Phone</span><span class="dt-value">${builder.phone}</span></div>` : ''}
                    ${builder.email ? `<div class="detail-item"><span class="dt-label">Email</span><span class="dt-value"><a href="mailto:${builder.email}">${builder.email}</a></span></div>` : ''}
                    ${builder.website ? `<div class="detail-item"><span class="dt-label">Website</span><span class="dt-value"><a href="${builder.website}" target="_blank">${builder.website.replace('https://','').replace('http://','').replace('www.','')}</a></span></div>` : ''}
                    ${builder.buyBox ? `<div class="detail-item"><span class="dt-label">Buy Box</span><span class="dt-value">${builder.buyBox}</span></div>` : ''}
                    ${builder.volume ? `<div class="detail-item"><span class="dt-label">Volume</span><span class="dt-value">${builder.volume}</span></div>` : ''}
                    ${builder.metro ? `<div class="detail-item"><span class="dt-label">Metro</span><span class="dt-value">${builder.metro}</span></div>` : ''}
                </div>
            `;
        });

        container.innerHTML = html;
        updateStats(displayData);
    }

    function updateStats(filteredData) {
        if (currentTab === 'lots') {
            const data = lotData;
            document.getElementById('total-builders').textContent = data.length;
            document.getElementById('active-builders').textContent = data.filter(l => l.status === 'contacted' || l.status === 'under-contract').length;
            document.getElementById('research-builders').textContent = data.filter(l => l.status === 'new').length;
            const uniqueStates = new Set(data.map(l => l.state));
            document.getElementById('state-count').textContent = uniqueStates.size;
        } else {
            const data = filteredData || builderData;
            document.getElementById('total-builders').textContent = data.length;
            document.getElementById('active-builders').textContent = data.filter(b => b.status === 'active').length;
            document.getElementById('research-builders').textContent = data.filter(b => b.status === 'research').length;

            const uniqueStates = new Set(data.map(b => b.state));
            document.getElementById('state-count').textContent = uniqueStates.size;
        }
    }

    function toggleDetails(id) {
        const el = document.getElementById('details-' + id);
        if (el) {
            el.classList.toggle('hidden');
        }
    }

    function copyBuilder(id) {
        const builder = builderData.find(b => b.id === id);
        if (!builder) return;

        let text = `${builder.name}\n`;
        if (builder.phone) text += `Phone: ${builder.phone}\n`;
        if (builder.email) text += `Email: ${builder.email}\n`;
        if (builder.website) text += `Web: ${builder.website}\n`;
        text += `Location: ${builder.county}, ${states[builder.state]?.name || builder.state}\n`;
        if (builder.buyBox) text += `Buy Box: ${builder.buyBox}`;

        navigator.clipboard.writeText(text).then(() => {
            showToast(`Copied ${builder.name}`);
        }).catch(() => {
            // Fallback
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast(`Copied ${builder.name}`);
        });
    }

    function exportCSV() {
        if (builderData.length === 0) {
            showToast('No data to export');
            return;
        }

        const headers = ['Name','Phone','Email','Website','County','State','Metro','Buy Box','Volume','Status','Date Added'];
        const rows = builderData.map(b => [
            `"${(b.name||'').replace(/"/g,'""')}"`,
            `"${b.phone||''}"`,
            `"${b.email||''}"`,
            `"${b.website||''}"`,
            `"${b.county||''}"`,
            `"${states[b.state]?.name||b.state||''}"`,
            `"${b.metro||''}"`,
            `"${(b.buyBox||'').replace(/"/g,'""')}"`,
            `"${b.volume||''}"`,
            b.status||'',
            b.dateAdded||''
        ]);

        const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'land-flip-builders.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('CSV exported');
    }

    function showToast(msg) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    // ════ Init ════
    document.addEventListener('DOMContentLoaded', init);
</script>
