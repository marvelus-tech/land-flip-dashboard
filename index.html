<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Flip Builder Discovery Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        /* Design Philosophy from Reference Image:
           - Soft cream/warm backgrounds
           - Rounded corners (xl/2xl)
           - Subtle shadows
           - Status badges with soft colors
           - Card-based layout
           - Clean typography hierarchy
        */
        
        body {
            background: linear-gradient(135deg, #faf9f6 0%, #f5f3ed 100%);
            min-height: 100vh;
        }
        
        .dashboard-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.04);
            transition: all 0.3s ease;
        }
        
        .dashboard-card:hover {
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .status-active {
            background: #dcfce7;
            color: #166534;
        }
        
        .status-research {
            background: #fef3c7;
            color: #92400e;
        }
        
        .status-contacted {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .progress-bar {
            height: 6px;
            border-radius: 3px;
            background: #f3f4f6;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        
        .builder-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        
        .county-tag {
            padding: 4px 10px;
            border-radius: 8px;
            background: #f0fdf4;
            color: #166534;
            font-size: 12px;
            font-weight: 500;
        }
        
        .action-btn {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .action-btn:hover {
            transform: scale(1.02);
        }
        
        .search-input {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 10px 16px 10px 40px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
        }
        
        .state-tab {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .state-tab:hover {
            background: #f3f4f6;
        }
        
        .state-tab.active {
            background: #0d9488;
            color: white;
        }
        
        .metric-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        
        .metric-value {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
        }
        
        .metric-label {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }
        
        .builder-row {
            transition: all 0.2s;
            border-radius: 12px;
        }
        
        .builder-row:hover {
            background: #f9fafb;
        }
        
        .copy-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .builder-row:hover .copy-btn {
            opacity: 1;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #111827;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 100;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="p-6">
    <!-- Header -->

            });

        // ── Load Data ──
        function loadData() {
            const stored = localStorage.getItem('builderData');
            if (stored) {
                const parsed = JSON.parse(stored);
                // Filter out any demo data (555 phone numbers are fake)
                builderData = parsed.filter(b => !b.phone.includes('555'));
                if (builderData.length === 0) {
                    builderData = JSON.parse(JSON.stringify(DEFAULT_BUILDERS));
                    localStorage.setItem('builderData', JSON.stringify(builderData));
                    renderBuilders();
                    updateStats();
                } else {
                    renderBuilders();
                    updateStats();
                }
            } else {
                builderData = JSON.parse(JSON.stringify(DEFAULT_BUILDERS));
                localStorage.setItem('builderData', JSON.stringify(builderData));
                renderBuilders();
                updateStats();
            }
        }

        // ── Show Empty State ──
        function showEmptyState() {
            builderData = [];
            document.getElementById('builder-list').innerHTML = '';
            document.getElementById('empty-state').classList.remove('hidden');
            updateStats();
        }

        // ── Render Builders ──
        function renderBuilders() {
            const container = document.getElementById('builder-list');
            const emptyState = document.getElementById('empty-state');
            
            let filtered = builderData;
            
            if (currentState !== 'all') {
                filtered = filtered.filter(b => b.state === currentState);
            }
            
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(b => 
                    b.name.toLowerCase().includes(searchTerm) ||
                    b.county.toLowerCase().includes(searchTerm) ||
                    b.state.toLowerCase().includes(searchTerm) ||
                    b.email.toLowerCase().includes(searchTerm)
                );
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            const grouped = filtered.reduce((acc, builder) => {
                if (!acc[builder.state]) acc[builder.state] = [];
                acc[builder.state].push(builder);
                return acc;
            }, {});
            
            container.innerHTML = Object.entries(grouped).map(([stateKey, builders]) => {
                const state = states[stateKey];
                return `
                    <div class="dashboard-card mb-6 overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-100 bg-gradient-to-r from-gray-50 to-white flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <span class="px-3 py-1 rounded-lg text-xs font-semibold ${state.color}">${state.name}</span>
                                <span class="text-sm text-gray-500">${state.metro} Metro</span>
                            </div>
                            <span class="text-sm text-gray-400">${builders.length} builders</span>
                        </div>
                        <div class="divide-y divide-gray-50">
                            ${builders.map(builder => `
                                <div class="builder-row px-6 py-4 flex items-center justify-between">
                                    <div class="flex items-start gap-4 flex-1 min-w-0">
                                        <div class="builder-avatar flex-shrink-0">${builder.initials}</div>
                                        <div class="flex-1 min-w-0">
                                            <div class="flex items-center gap-3 mb-1">
                                                <h3 class="text-base font-semibold text-gray-900">${builder.name}</h3>
                                                <span class="status-badge status-${builder.status}">
                                                    <span class="w-1.5 h-1.5 rounded-full bg-current"></span>
                                                    ${builder.status}
                                                </span>
                                            </div>
                                            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-gray-500">
                                                <span class="flex items-center gap-1">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                                    </svg>
                                                    ${builder.county}
                                                </span>
                                                <span class="flex items-center gap-1">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                                                    </svg>
                                                    ${builder.phone}
                                                </span>
                                                <span class="flex items-center gap-1">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                                    </svg>
                                                    ${builder.email}

                                            <div class="mt-2 flex items-center gap-2">

                                            </div>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2 ml-4">
                                        <button onclick="copyToClipboard('${builder.email}')" class="copy-btn p-2 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600" title="Copy email">

                                            </svg>

                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                                            </svg>
                                        </a>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ── Filter Builders ──
        function filterBuilders() {
            renderBuilders();
        }

        // ── Update Stats ──
        function updateStats() {
            document.getElementById('stat-builders').textContent = builderData.length;
            document.getElementById('stat-counties').textContent = [...new Set(builderData.map(b => b.county))].length;
        }

        // ── Copy to Clipboard ──
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = 'Copied to clipboard!';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            });
        }

        // ── Export Data ──
        function exportData() {
            const csv = [
                ['Name', 'State', 'County', 'Metro', 'Phone', 'Email', 'Website', 'Buy Box', 'Volume', 'Status', 'Date Added'],
                ...builderData.map(b => [b.name, b.state, b.county, b.metro, b.phone, b.email, b.website, b.buyBox, b.volume, b.status, b.dateAdded])
            ].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `builder-discovery-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        // ── Refresh Data ──
        function refreshData() {
            loadData();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = 'Data refreshed!';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // ── Initialize ──
        init();
    </script>
