<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Flip Builder Discovery Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        /* Design Philosophy from Reference Image:
           - Soft cream/warm backgrounds
           - Rounded corners (xl/2xl)
           - Subtle shadows
           - Status badges with soft colors
           - Card-based layout
           - Clean typography hierarchy
        */
        
        body {
            background: linear-gradient(135deg, #faf9f6 0%, #f5f3ed 100%);
            min-height: 100vh;
        }
        
        .dashboard-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.04);
            transition: all 0.3s ease;
        }
        
        .dashboard-card:hover {
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .status-active {
            background: #dcfce7;
            color: #166534;
        }
        
        .status-research {
            background: #fef3c7;
            color: #92400e;
        }
        
        .status-contacted {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .progress-bar {
            height: 6px;
            border-radius: 3px;
            background: #f3f4f6;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        
        .builder-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        
        .county-tag {
            padding: 4px 10px;
            border-radius: 8px;
            background: #f0fdf4;
            color: #166534;
            font-size: 12px;
            font-weight: 500;
        }
        
        .action-btn {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .action-btn:hover {
            transform: scale(1.02);
        }
        
        .search-input {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 10px 16px 10px 40px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
        }
        
        .state-tab {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .state-tab:hover {
            background: #f3f4f6;
        }
        
        .state-tab.active {
            background: #0d9488;
            color: white;
        }
        
        .metric-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        
        .metric-value {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
        }
        
        .metric-label {
            font-size: 13px;
            color: #6b7280;
            margin-top: 4px;
        }
        
        .builder-row {
            transition: all 0.2s;
            border-radius: 12px;
        }
        
        .builder-row:hover {
            background: #f9fafb;
        }
        
        .copy-btn {
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .builder-row:hover .copy-btn {
            opacity: 1;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #111827;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 100;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="p-6">
    <!-- Header -->
    <header class="max-w-7xl mx-auto mb-8">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Builder Discovery</h1>
                <p class="text-sm text-gray-500 mt-1">Land Flipping Intelligence • Updated Daily</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-sm font-medium text-gray-900" id="current-date"></p>
                    <p class="text-xs text-teal-600 font-medium" id="next-market"></p>
                </div>
                <button onclick="refreshData()" class="action-btn bg-teal-600 text-white hover:bg-teal-700">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    Refresh
                </button>
            </div>
        </div>
    </header>

    <!-- Metrics -->
    <div class="max-w-7xl mx-auto mb-8">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="metric-card">
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-8 h-8 rounded-lg bg-teal-100 flex items-center justify-center">
                        <svg class="w-4 h-4 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                        </svg>
                    </div>
                    <span class="text-xs text-gray-500 font-medium">Total Builders</span>
                </div>
                <div class="metric-value" id="stat-builders">0</div>
                <div class="progress-bar mt-2">
                    <div class="progress-fill bg-teal-500" style="width: 65%"></div>
                </div>
            </div>
            
            <div class="metric-card">
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-8 h-8 rounded-lg bg-blue-100 flex items-center justify-center">
                        <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064"/>
                        </svg>
                    </div>
                    <span class="text-xs text-gray-500 font-medium">Markets</span>
                </div>
                <div class="metric-value" id="stat-markets">8</div>
                <div class="progress-bar mt-2">
                    <div class="progress-fill bg-blue-500" style="width: 100%"></div>
                </div>
            </div>
            
            <div class="metric-card">
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-8 h-8 rounded-lg bg-amber-100 flex items-center justify-center">
                        <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                        </svg>
                    </div>
                    <span class="text-xs text-gray-500 font-medium">Counties</span>
                </div>
                <div class="metric-value" id="stat-counties">0</div>
                <div class="progress-bar mt-2">
                    <div class="progress-fill bg-amber-500" style="width: 45%"></div>
                </div>
            </div>
            
            <div class="metric-card">
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-8 h-8 rounded-lg bg-purple-100 flex items-center justify-center">
                        <svg class="w-4 h-4 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <span class="text-xs text-gray-500 font-medium">Last Update</span>
                </div>
                <div class="metric-value text-lg" id="stat-last-update">Today</div>
                <div class="text-xs text-gray-400 mt-1">Auto-generated</div>
            </div>
        </div>
    </div>

    <!-- Search & Filters -->
    <div class="max-w-7xl mx-auto mb-6">
        <div class="dashboard-card p-4 flex flex-col sm:flex-row gap-4">
            <div class="flex-1 relative">
                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input type="text" 
                       id="search-input"
                       placeholder="Search builders, counties, or states..." 
                       class="search-input w-full"
                       oninput="filterBuilders()">
            </div>
            <div class="flex gap-2">
                <select id="filter-state" onchange="filterBuilders()" class="search-input bg-white">
                    <option value="">All States</option>
                    <option value="texas">Texas</option>
                    <option value="florida">Florida</option>
                    <option value="north-carolina">North Carolina</option>
                    <option value="arizona">Arizona</option>
                    <option value="tennessee">Tennessee</option>
                    <option value="georgia">Georgia</option>
                    <option value="south-carolina">South Carolina</option>
                    <option value="indiana">Indiana</option>
                </select>
                <button onclick="exportData()" class="action-btn bg-gray-900 text-white hover:bg-gray-800">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                    </svg>
                    Export
                </button>
            </div>
        </div>
    </div>

    <!-- State Tabs -->
    <div class="max-w-7xl mx-auto mb-6">
        <div class="dashboard-card p-2 flex gap-2 overflow-x-auto" id="state-tabs">
            <!-- Tabs generated by JS -->
        </div>
    </div>

    <!-- Builder List -->
    <div class="max-w-7xl mx-auto" id="builder-list">
        <!-- Builder cards generated by JS -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden max-w-7xl mx-auto text-center py-16">
        <div class="w-16 h-16 bg-gray-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
        </div>
        <h3 class="text-lg font-medium text-gray-900 mb-2">No builders found</h3>
        <p class="text-gray-500">Try adjusting your search or filter criteria.</p>
    </div>

    <script>
        // ── Data Store ──
        let builderData = [];
        let currentState = 'all';

        // ── State Configuration ──
        const states = {
            texas: { name: 'Texas', color: 'bg-red-100 text-red-800', metro: 'Houston', counties: ['Waller', 'Montgomery', 'Brazoria', 'Fort Bend', 'Galveston'] },
            florida: { name: 'Florida', color: 'bg-orange-100 text-orange-800', metro: 'Orlando', counties: ['Polk', 'Lake', 'Osceola', 'Orange', 'Seminole'] },
            'north-carolina': { name: 'North Carolina', color: 'bg-blue-100 text-blue-800', metro: 'Charlotte', counties: ['Rowan', 'Cabarrus', 'Iredell', 'Union', 'Mecklenburg'] },
            arizona: { name: 'Arizona', color: 'bg-yellow-100 text-yellow-800', metro: 'Phoenix', counties: ['Maricopa', 'Pinal', 'Yavapai'] },
            tennessee: { name: 'Tennessee', color: 'bg-purple-100 text-purple-800', metro: 'Nashville', counties: ['Rutherford', 'Wilson', 'Sumner', 'Williamson'] },
            georgia: { name: 'Georgia', color: 'bg-green-100 text-green-800', metro: 'Atlanta', counties: ['Forsyth', 'Hall', 'Jackson', 'Douglas', 'Gwinnett'] },
            'south-carolina': { name: 'South Carolina', color: 'bg-indigo-100 text-indigo-800', metro: 'Charleston', counties: ['Berkeley', 'Dorchester', 'Charleston'] },
            indiana: { name: 'Indiana', color: 'bg-pink-100 text-pink-800', metro: 'Indianapolis', counties: ['Boone', 'Hamilton', 'Hendricks'] }
        };

        // ── Initialize ──
        function init() {
            document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            const dayMod = new Date().getDate() % 8;
            const marketNames = ['Indiana', 'Texas', 'Florida', 'North Carolina', 'Arizona', 'Tennessee', 'Georgia', 'South Carolina'];
            document.getElementById('next-market').textContent = `Next: ${marketNames[dayMod]}`;
            
            renderTabs();
            loadData();
        }

        // ── Render State Tabs ──
        function renderTabs() {
            const tabsContainer = document.getElementById('state-tabs');
            let html = `
                <button onclick="setState('all')" class="state-tab ${currentState === 'all' ? 'active' : 'text-gray-600'}" data-state="all">
                    All States
                </button>
            `;
            
            Object.entries(states).forEach(([key, state]) => {
                html += `
                    <button onclick="setState('${key}')" class="state-tab ${currentState === key ? 'active' : 'text-gray-600'}" data-state="${key}">
                        ${state.name}
                        <span class="ml-1 text-xs opacity-70">${state.counties.length}</span>
                    </button>
                `;
            });
            
            tabsContainer.innerHTML = html;
        }

        // ── Set Active State ──
        function setState(state) {
            currentState = state;
            renderTabs();
            filterBuilders();
        }

        // ── Load Data ──
        function loadData() {
            const stored = localStorage.getItem('builderData');
            if (stored) {
                builderData = JSON.parse(stored);
                renderBuilders();
                updateStats();
            } else {
                loadSampleData();
            }
        }

        // ── Sample Data ──
        function loadSampleData() {
            builderData = [
                {
                    id: 1,
                    name: 'Lennar Homes',
                    state: 'texas',
                    county: 'Waller County',
                    metro: 'Houston',
                    phone: '(713) 555-0100',
                    email: 'land@lennar.com',
                    website: 'https://www.lennar.com',
                    buyBox: '0.15-0.25 acres, $30K-$60K/lot',
                    volume: '50+ lots/year',
                    status: 'active',
                    dateAdded: '2026-06-21',
                    initials: 'LH'
                },
                {
                    id: 2,
                    name: 'D.R. Horton',
                    state: 'texas',
                    county: 'Montgomery County',
                    metro: 'Houston',
                    phone: '(281) 555-0200',
                    email: 'acquisitions@drhorton.com',
                    website: 'https://www.drhorton.com',
                    buyBox: '0.15-0.25 acres, $25K-$55K/lot',
                    volume: '100+ lots/year',
                    status: 'active',
                    dateAdded: '2026-06-21',
                    initials: 'DR'
                },
                {
                    id: 3,
                    name: 'Taylor Morrison',
                    state: 'texas',
                    county: 'Bastrop County',
                    metro: 'Austin',
                    phone: '(512) 555-0300',
                    email: 'land@taylormorrison.com',
                    website: 'https://www.taylormorrison.com',
                    buyBox: '0.5-1 acre, $60K-$120K/lot',
                    volume: '30+ lots/year',
                    status: 'active',
                    dateAdded: '2026-06-21',
                    initials: 'TM'
                },
                {
                    id: 4,
                    name: 'Pulte Homes',
                    state: 'florida',
                    county: 'Polk County',
                    metro: 'Orlando',
                    phone: '(407) 555-0400',
                    email: 'land@pulte.com',
                    website: 'https://www.pulte.com',
                    buyBox: '0.15-0.5 acres, $35K-$70K/lot',
                    volume: '40+ lots/year',
                    status: 'active',
                    dateAdded: '2026-06-21',
                    initials: 'PH'
                },
                {
                    id: 5,
                    name: 'KB Home',
                    state: 'florida',
                    county: 'Lake County',
                    metro: 'Orlando',
                    phone: '(352) 555-0500',
                    email: 'acquisitions@kbhome.com',
                    website: 'https://www.kbhome.com',
                    buyBox: '0.15-0.25 acres, $30K-$50K/lot',
                    volume: '60+ lots/year',
                    status: 'active',
                    dateAdded: '2026-06-21',
                    initials: 'KB'
                }
            ];
            
            renderBuilders();
            updateStats();
        }

        // ── Render Builders ──
        function renderBuilders() {
            const container = document.getElementById('builder-list');
            const emptyState = document.getElementById('empty-state');
            
            let filtered = builderData;
            
            if (currentState !== 'all') {
                filtered = filtered.filter(b => b.state === currentState);
            }
            
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(b => 
                    b.name.toLowerCase().includes(searchTerm) ||
                    b.county.toLowerCase().includes(searchTerm) ||
                    b.state.toLowerCase().includes(searchTerm) ||
                    b.email.toLowerCase().includes(searchTerm)
                );
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            const grouped = filtered.reduce((acc, builder) => {
                if (!acc[builder.state]) acc[builder.state] = [];
                acc[builder.state].push(builder);
                return acc;
            }, {});
            
            container.innerHTML = Object.entries(grouped).map(([stateKey, builders]) => {
                const state = states[stateKey];
                return `
                    <div class="dashboard-card mb-6 overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-100 bg-gradient-to-r from-gray-50 to-white flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <span class="px-3 py-1 rounded-lg text-xs font-semibold ${state.color}">${state.name}</span>
                                <span class="text-sm text-gray-500">${state.metro} Metro</span>
                            </div>
                            <span class="text-sm text-gray-400">${builders.length} builders</span>
                        </div>
                        <div class="divide-y divide-gray-50">
                            ${builders.map(builder => `
                                <div class="builder-row px-6 py-4 flex items-center justify-between">
                                    <div class="flex items-start gap-4 flex-1 min-w-0">
                                        <div class="builder-avatar flex-shrink-0">${builder.initials}</div>
                                        <div class="flex-1 min-w-0">
                                            <div class="flex items-center gap-3 mb-1">
                                                <h3 class="text-base font-semibold text-gray-900">${builder.name}</h3>
                                                <span class="status-badge status-${builder.status}">
                                                    <span class="w-1.5 h-1.5 rounded-full bg-current"></span>
                                                    ${builder.status}
                                                </span>
                                            </div>
                                            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-gray-500">
                                                <span class="flex items-center gap-1">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                                    </svg>
                                                    ${builder.county}
                                                </span>
                                                <span class="flex items-center gap-1">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                                                    </svg>
                                                    ${builder.phone}
                                                </span>
                                                <span class="flex items-center gap-1">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                                                    </svg>
                                                    ${builder.email}
                                                </span>
                                            </div>
                                            <div class="mt-2 flex items-center gap-2">
                                                <span class="county-tag">${builder.buyBox}</span>
                                                <span class="county-tag bg-blue-50 text-blue-700">${builder.volume}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2 ml-4">
                                        <button onclick="copyToClipboard('${builder.email}')" class="copy-btn p-2 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600" title="Copy email">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                                            </svg>
                                        </button>
                                        <a href="${builder.website}" target="_blank" class="p-2 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600" title="Visit website">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                                            </svg>
                                        </a>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ── Filter Builders ──
        function filterBuilders() {
            renderBuilders();
        }

        // ── Update Stats ──
        function updateStats() {
            document.getElementById('stat-builders').textContent = builderData.length;
            document.getElementById('stat-counties').textContent = [...new Set(builderData.map(b => b.county))].length;
        }

        // ── Copy to Clipboard ──
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.textContent = 'Copied to clipboard!';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 2000);
            });
        }

        // ── Export Data ──
        function exportData() {
            const csv = [
                ['Name', 'State', 'County', 'Metro', 'Phone', 'Email', 'Website', 'Buy Box', 'Volume', 'Status', 'Date Added'],
                ...builderData.map(b => [b.name, b.state, b.county, b.metro, b.phone, b.email, b.website, b.buyBox, b.volume, b.status, b.dateAdded])
            ].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `builder-discovery-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        // ── Refresh Data ──
        function refreshData() {
            loadData();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = 'Data refreshed!';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // ── Initialize ──
        init();
    </script>
</body>
</html>
